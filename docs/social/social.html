<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap");
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 640px; overflow: hidden; font-family: Geist, system-ui, sans-serif;
    background: #f4f5f7; color: #15171c; display: flex; align-items: center; }
  .copy { width: 520px; padding-left: 80px; }
  .mark { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .mark span { width: 48px; height: 48px; border-radius: 14px; background: #3d6bf5; display: grid; place-items: center; }
  h1 { margin-top: 40px; font-size: 54px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #3d6bf5; }
  p { margin-top: 22px; font-size: 22px; line-height: 1.4; color: #5a5f6b; }
  .tags { margin-top: 32px; display: flex; gap: 10px; }
  .tags b { font-weight: 500; font-size: 16px; background: #fff; border: 1px solid #e9eaee; border-radius: 10px; padding: 8px 12px; color: #5a5f6b; }
  .shot { position: absolute; right: -120px; top: 70px; width: 840px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 40px 80px -24px rgba(16,24,40,.35); border: 1px solid #e9eaee; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">
      <span><svg width="30" height="30" viewBox="0 0 20 20" fill="none"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><rect x="7.5" y="6" width="5" height="8" rx="1.5" fill="#fff"/></svg></span>
      Framelane
    </div>
    <h1>App Store screenshots and metadata, <em>shipped.</em></h1>
    <p>Design, localize and publish to App Store Connect from one self-hosted app.</p>
    <div class="tags"><b>Open source</b><b>Self-hosted</b><b>MIT</b></div>
  </div>
  <div class="shot"><img src="../images/editor.png" /></div>
</body>
</html>
